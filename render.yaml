# ============================================================================
# ClipMind AI — Render Blueprint
#
# Deploys the Dockerized FastAPI backend + a managed PostgreSQL database.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render: New -> Blueprint -> connect this GitHub repo.
#   3. Render creates the PostgreSQL database and the Docker web service.
#   4. Then, in the Render dashboard, fill in SECRET_KEY and GOOGLE_API_KEY
#      (created with `sync: false`), and replace the backend URL placeholder
#      (https://your-backend.onrender.com) with your real backend URL.
#      The frontend origin is already set to https://clip-mind-frontend.vercel.app.
# ============================================================================
services:
  - type: web
    name: clipmind-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipmind-postgres
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: https://clip-mind-frontend.vercel.app
      - key: BACKEND_URL
        value: https://your-backend.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE
        value: "104857600"
      - key: NLTK_DATA
        value: /var/data/nltk_data
    # Persistent disk for uploaded videos (audio/thumbnails stay ephemeral
    # on /app for now — moving media to S3 is the recommended next step).
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10

databases:
  - name: clipmind-postgres
    plan: starter
